<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Corruption vs. Houses</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        h1 {
            color: #0066cc;
            margin: 0;
        }
        p {
            color: #555;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card h2 {
            margin-top: 0;
            color: #444;
        }
        pre {
            background: #f0f4f8;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9rem;
        }
        footer {
            font-size: 0.8rem;
            color: #999;
            margin-top: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Corruption vs. Amount of houses you could buy</h1>
        <p>Comparing money lost in a corruption transaction to the number of avarage houses wage earners could buy.</p>
    </header>

    <div class="card">
        <h2>URL Parameters</h2>
        <pre id="params">Loading...</pre>
    </div>

    <div class="card">
        <h2>Data from JSON</h2>
        <pre id="json">Loading...</pre>
    </div>

    <footer>
        &copy; 2025 Erik Szalai – Please attribute if you use this idea or code.
    </footer>

    <script>
        // --- Read URL parameters ---
        const params = new URLSearchParams(window.location.search);
        let paramObj = {};
        for (const [key, value] of params.entries()) {
            paramObj[key] = value;
        }
        document.getElementById('params').textContent = 
            Object.keys(paramObj).length ? JSON.stringify(paramObj, null, 2) : "No parameters in URL.";

        // --- Fetch JSON from same repo ---
        fetch('data.json')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                return response.json();
            })
            .then(data => {
                document.getElementById('json').textContent = JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById('json').textContent = "Error loading JSON: " + error;
            });
    </script>
</body>
</html>
